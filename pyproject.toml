[project]
name = "nh-nodes"
description = "ComfyUI custom nodes for image workflows, tiling, masks, smart resize, logic routing, prompt and text tools, batch automation, garment/portrait segmentation, and VTON preprocessing."
version = "1.3.0"
license = { file = "LICENSE" }
dependencies = [
    "numpy",
    "Pillow",
    "scipy",
    "opencv-python",
    "scikit-image>=0.18.0",
    "onnxruntime>=1.8.0",
    "transformers>=4.20.0",
    "tqdm>=4.62.0",
    "huggingface_hub>=0.16.0",
]

[project.urls]
Repository = "https://github.com/jetthuangai/NH-Nodes"

[tool.comfy]
PublisherId = "nhathoangfoto"
